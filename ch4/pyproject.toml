[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlflow-sample-agents"
version = "0.1.0"
description = "MLflowサンプルエージェント"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # MLflow
    "mlflow>=3.9.0",
    # LangGraph / LangChain
    "langgraph>=1.0.10rc1",
    "langchain>=1.0.0",
    "langchain-openai>=1.1.14",
    "langchain-community>=0.3.0",
    # ベクトルストア
    "langchain-milvus>=0.2.0,<0.3.0",
    "pymilvus>=2.5.7,<2.6.0",
    "milvus-lite>=2.4.0,<2.5.0",
    "setuptools<75",
    # ツール
    "exa-py>=1.0.0",
    "requests>=2.33.0",
    # ユーティリティ
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    # データ取り込み
    "html2text>=2024.0.0",
    "scrapy>=2.14.2",
    "tiktoken>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agents", "cli", "scripts"]
